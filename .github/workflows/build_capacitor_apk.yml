name: Build Capacitor Android APK
run-name: Build AgroSansar Capacitor APK by @${{ github.actor }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-capacitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agrosansar-react/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: agrosansar-react
        run: npm ci

      - name: Build Web Application
        working-directory: agrosansar-react
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: agrosansar-react
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: agrosansar-react/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Capacitor APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgroSansar-React-Capacitor-Debug-APK
          path: agrosansar-react/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
